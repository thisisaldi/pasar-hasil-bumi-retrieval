[project]
name = "twotower"
version = "0.1.0"
description = "Two-tower retrieval for Pasar Hasil Bumi (cart-aware product recommendation)"
requires-python = ">=3.10,<3.12"  # tensorflow 2.15 has no wheels for 3.12+
dependencies = [
    "tensorflow==2.15.1",
    "tensorflow-recommenders==0.7.3",
    "numpy<2",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
